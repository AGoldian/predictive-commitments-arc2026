 <title>Coverage, efficacy, and official result</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Coverage, efficacy, and official result</dc:title>
    <dc:description>Three distinct evidence levels for P: DEV packet supply was 89/417 (21.3%), below the frozen 50% feasibility gate; the main P−A1 mechanism contrast is unavailable because the sequence stopped after B1 evidence refusal; official submission 57749129 completed with public score 0.00. The official observation does not reveal rerun cause, runtime or traces. DEV covers four exposed public games at seed 101. Official score and DEV coverage are different quantities; these observations establish neither successful full baseline reproduction nor an advantage.</dc:description>
